<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>貼圖關鍵字搜尋</title>
<style>
  :root {
    --bg: #14141c;
    --panel: #1e1e2a;
    --border: #33333f;
    --text: #e8e8ee;
    --sub: #9a9aab;
    --accent: #7c9eff;
  }
  [data-theme="light"] {
    --bg: #f4f4f8;
    --panel: #ffffff;
    --border: #dcdce4;
    --text: #1c1c26;
    --sub: #6b6b7a;
    --accent: #4a6fd6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
    padding: 20px 16px 60px;
    transition: background 0.2s, color 0.2s;
  }
  .top-bar {
    display: flex;
    justify-content: flex-end;
    max-width: 900px;
    margin: 0 auto 12px;
  }
  .theme-toggle {
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
  }
  h1 {
    text-align: center;
    font-size: 22px;
    margin: 0 0 16px;
  }
  .tabs {
    display: flex;
    justify-content: center;
    gap: 8px;
    max-width: 500px;
    margin: 0 auto 20px;
  }
  .tab-btn {
    flex: 1;
    padding: 10px 0;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--sub);
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.15s;
  }
  .tab-btn.active {
    background: var(--accent);
    color: #ffffff;
    border-color: var(--accent);
  }
  .search-box {
    max-width: 500px;
    margin: 0 auto 8px;
    display: flex;
    gap: 8px;
  }
  .search-box input {
    flex: 1;
    padding: 12px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 15px;
  }
  .search-box input:focus {
    outline: none;
    border-color: var(--accent);
  }
  .search-box button {
    padding: 12px 20px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: #ffffff;
    font-weight: bold;
    cursor: pointer;
  }
  .hint {
    text-align: center;
    color: var(--sub);
    font-size: 13px;
    margin-bottom: 24px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 14px;
    max-width: 900px;
    margin: 0 auto;
    align-items: stretch;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px;
    text-align: center;
    transition: background 0.2s, border-color 0.2s;
    display: flex;
    flex-direction: column;
    height: 100%;
  }
  .card img {
    width: 100%;
    max-height: 100px;
    object-fit: contain;
    border-radius: 6px;
    margin-bottom: 8px;
    background: #ffffff;
    padding: 6px;
  }
  .card .lv {
    display: inline-block;
    background: var(--accent);
    color: #ffffff;
    font-size: 11px;
    font-weight: bold;
    padding: 2px 8px;
    border-radius: 10px;
    margin-bottom: 6px;
  }
  .card .position {
    color: var(--sub);
    font-size: 12px;
    margin-bottom: 4px;
  }
  .card .keyword {
    font-size: 13px;
    line-height: 1.4;
    margin-bottom: 8px;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card .copy-btn {
    width: 100%;
    padding: 6px 0;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--accent);
    color: #ffffff;
    font-size: 12px;
    cursor: pointer;
    transition: opacity 0.15s;
    margin-top: auto;
  }
  .card .copy-btn:active {
    opacity: 0.7;
  }
  .card .copy-btn.copied {
    background: #4caf50;
  }
  .status {
    text-align: center;
    color: var(--sub);
    padding: 40px 0;
  }
</style>
</head>
<body>

<div class="top-bar">
  <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">🌙 深色</button>
</div>

<h1>貼圖關鍵字搜尋</h1>

<div class="tabs" id="tabs">
  <button class="tab-btn active" data-key="chest">胸毛公寓</button>
  <button class="tab-btn" data-key="little">小傢伙</button>
</div>

<div class="search-box">
  <input id="keywordInput" type="text" placeholder="輸入關鍵字，多個關鍵字用空白分隔">
  <button onclick="doSearch()">搜尋</button>
</div>
<div class="hint">例如：床上 起來（會找出同時符合任一關鍵字的貼圖）</div>

<div id="results" class="grid"></div>
<div id="status" class="status">請輸入關鍵字開始搜尋</div>

<script>
  // 兩份試算表各自的 Apps Script /exec 網址
  const SCRIPT_URLS = {
    chest: "https://script.google.com/macros/s/AKfycbxC3m87puyhhm6pkJ8pujRDRap-9Fxltitxuv0iw9QsaRmTtoOCYjHDWcZ4JSU5Jlmf/exec",
    little: "請貼上「小傢伙」的_exec_網址"
  };

  let currentKey = "chest";

  const input = document.getElementById('keywordInput');
  const resultsEl = document.getElementById('results');
  const statusEl = document.getElementById('status');
  const toggleBtn = document.getElementById('themeToggle');
  const tabsEl = document.getElementById('tabs');

  // ---- 分頁切換 ----
  tabsEl.addEventListener('click', function(e) {
    const btn = e.target.closest('.tab-btn');
    if (!btn) return;
    tabsEl.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentKey = btn.dataset.key;
    resultsEl.innerHTML = '';
    statusEl.style.display = 'block';
    statusEl.textContent = '請輸入關鍵字開始搜尋';
    input.value = '';
  });

  // ---- 主題切換 ----
  function applyTheme(theme) {
    if (theme === 'light') {
      document.documentElement.setAttribute('data-theme', 'light');
      toggleBtn.textContent = '☀️ 淺色';
    } else {
      document.documentElement.removeAttribute('data-theme');
      toggleBtn.textContent = '🌙 深色';
    }
  }

  function toggleTheme() {
    const isLight = document.documentElement.getAttribute('data-theme') === 'light';
    const next = isLight ? 'dark' : 'light';
    localStorage.setItem('pjsekai_theme', next);
    applyTheme(next);
  }

  const saved = localStorage.getItem('pjsekai_theme');
  if (saved) {
    applyTheme(saved);
  } else if (window.matchMedia('(prefers-color-scheme: light)').matches) {
    applyTheme('light');
  }

  // ---- 搜尋 ----
  let searchToken = 0; // 每次搜尋都給一個新編號，只有最新那次的結果才會被畫出來

  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') doSearch();
  });

  async function doSearch() {
    const myToken = ++searchToken;
    const keyword = input.value.trim();
    resultsEl.innerHTML = '';
    statusEl.style.display = 'block';
    statusEl.textContent = '搜尋中...';

    try {
      const url = SCRIPT_URLS[currentKey] + '?keyword=' + encodeURIComponent(keyword);
      const res = await fetch(url);
      const data = await res.json();

      // 如果使用者在等待期間又發起了新的搜尋，這次的結果就不畫了
      if (myToken !== searchToken) return;

      if (!data.length) {
        statusEl.textContent = '找不到符合的貼圖';
        return;
      }

      statusEl.style.display = 'none';
      resultsEl.innerHTML = '';
      data.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          ${item.image ? `<img src="${item.image}" alt="貼圖">` : ''}
          <div class="lv">LV ${item.lv}</div>
          <div class="position">${item.position}</div>
          <div class="keyword">${item.keyword}</div>
          ${item.image ? `<button class="copy-btn">複製圖片</button>` : ''}
        `;
        if (item.image) {
          const btn = card.querySelector('.copy-btn');
          btn.addEventListener('click', () => copyImage(item.image, btn));
        }
        resultsEl.appendChild(card);
      });
    } catch (err) {
      if (myToken !== searchToken) return;
      statusEl.style.display = 'block';
      statusEl.textContent = '讀取失敗，請確認 Apps Script 網址與部署權限';
      console.error(err);
    }
  }

  // ---- 複製圖片 ----
  async function copyImage(url, btnEl) {
    const originalText = btnEl.textContent;
    try {
      const response = await fetch(url);
      const blob = await response.blob();
      const bitmap = await createImageBitmap(blob);

      const canvas = document.createElement('canvas');
      canvas.width = bitmap.width;
      canvas.height = bitmap.height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(bitmap, 0, 0);

      canvas.toBlob(async (pngBlob) => {
        try {
          await navigator.clipboard.write([
            new ClipboardItem({ 'image/png': pngBlob })
          ]);
          btnEl.textContent = '已複製 ✓';
          btnEl.classList.add('copied');
          setTimeout(() => {
            btnEl.textContent = originalText;
            btnEl.classList.remove('copied');
          }, 1500);
        } catch (err) {
          fallbackOpen(url);
        }
      }, 'image/png');
    } catch (err) {
      fallbackOpen(url);
    }
  }

  function fallbackOpen(url) {
    window.open(url, '_blank');
  }
</script>

</body>
</html>
